name: 🚀 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📦 HACS validation
        uses: hacs/action@main
        with:
          category: "integration"
          ignore: brands

      - name: 🏠 Validate with hassfest
        uses: home-assistant/actions/hassfest@master